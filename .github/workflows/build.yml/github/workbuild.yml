name: Build TONONKIRA A.P.T.M.

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir -p source
          unzip -o TONONKIRA_APTM_NOUVEAU.zip -d source

      - name: Build APK
        run: |
          PROJECT_DIR=$(find source -name settings.gradle -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR"
          gradle -p "$PROJECT_DIR" assembleDebug --stacktrace
          APK=$(find "$PROJECT_DIR" -name '*.apk' -path '*/outputs/apk/debug/*' | head -n 1)
          test -n "$APK"
          cp "$APK" app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TONONKIRA-APTM-APK
          path: app-debug.apk
